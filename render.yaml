# Render blueprint for the novel_harness web UI (novel_harness/webapi/ + web/).
# https://render.com/docs/blueprint-spec
#
# Deployed on Render's FREE tier by explicit choice -- no persistent disk. That means every novel
# created or edited through the browser lives only on the service's container filesystem, which
# Render wipes on every restart, redeploy, and free-tier sleep/wake cycle. Fine for a demo; treat
# anything created here as disposable. To make novel data durable, upgrade the plan below to a
# paid tier and add a `disk:` block (mountPath e.g. /data) plus HOME/NOVEL_HARNESS_ROOT env vars
# pointing at it -- see registry.py's NOVELS_ROOT docstring for why both matter.
services:
  - type: web
    name: storyteller
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      cd web && npm ci && npm run build
    startCommand: python -m novel_harness.webapi --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/projects
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: INFERDEX_API_KEY
        sync: false   # set manually in the Render dashboard -- never committed. Optional: llm.py
                       # falls back to a hardcoded default key already in the repo if unset.
      # Optional overrides (uncomment/set in the dashboard if not using the InferDex default):
      # - key: INFERDEX_BASE_URL
      # - key: INFERDEX_MODEL
